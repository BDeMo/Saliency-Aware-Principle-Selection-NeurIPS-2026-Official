work_dir: outputs
eval_backend: VLMEvalKit

eval_config:
  model:
    - type: Qwen3-VL-2B-Thinking
      name: CustomAPIModel
      api_base: http://127.0.0.1:8203/v1/chat/completions  # instruct_clean
      key: EMPTY
      temperature: 0.0
      max_tokens: 4096

  data:
    # ---------- Reasoning / Robustness ----------
    - POPE
    - MME
    # - MMVet

    # ---------- Core MCQ / General ----------
    - MMBench_DEV_EN_V11
    # - MMBench_DEV_CN_V11
    - MMStarz
    - SEEDBench_IMG
    # - SEEDBench2
    # - SEEDBench2_Plus

    # ---------- Science / Knowledge ----------
    - MMMU_DEV_VAL
    - ScienceQA_VAL

    # ---------- OCR / Text / Chart ----------
    - TextVQA_VAL
    - OCRVQA_TESTCORE
    - OCRBench
    - ChartQA_TEST

    # ---------- Doc ----------
    - DocVQA_VAL
    - InfoVQA_VAL

    # ---------- Extras (optional but common) ----------
    - AI2D_TEST
    - BLINK
    - RealWorldQA
    # - MathVista_MINI

  mode: all
  limit: null
  reuse: true
  nproc: 16
  judge: exact_matching
