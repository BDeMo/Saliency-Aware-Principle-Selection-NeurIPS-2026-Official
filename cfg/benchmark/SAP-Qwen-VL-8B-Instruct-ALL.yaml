work_dir: outputs
eval_backend: VLMEvalKit

eval_config:
  model:
    - type: SAPGroundedVQA-8040
      name: CustomAPIModel
      api_base: http://127.0.0.1:8040/v1/chat/completions
      key: EMPTY
      temperature: 0.0
      max_tokens: 4096

  data:
    # ---------- Reasoning / Robustness ----------
    # - POPE
    # - MME

    # ---------- Core MCQ / General ----------
    # - MMBench_DEV_EN_V11
    # - MMStar
    # - SEEDBench_IMG

    # ---------- Science / Knowledge ----------
    # - MMMU_DEV_VAL
    # - ScienceQA_VAL

    # ---------- OCR / Text / Chart ----------
    # - TextVQA_VAL
    # - OCRVQA_TESTCORE
    # - OCRBench
    # - ChartQA_TEST

    # ---------- Doc ----------
    # - DocVQA_VAL
    # - InfoVQA_VAL

    # ---------- Extras (optional but common) ----------
    - AI2D_TEST
    - BLINK
    - RealWorldQA

  mode: all
  limit: null
  reuse: true
  nproc: 16
  judge: exact_matching
